[package]
name = "gotek-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
description = "Rust library for managing original-firmware Gotek USB floppy emulator images"
readme = "README.md"
keywords = ["gotek", "floppy", "fat12", "disk-image", "ipcas"]
categories = ["filesystem", "command-line-utilities"]

license = "MIT OR Apache-2.0"
include = [
    "Cargo.toml", "Cargo.lock", "LICENSE", "LICENSE-APACHE", "README.md",
    "src/**/*.rs", "src/boot/*.S", "src/boot/README.md",
    "tests/**/*.rs", "tests/fixtures/*-bpb.bin", "tests/fixtures/*-root-label.bin",
    "tests/fixtures/README.md", "examples/**/*.rs",
]

repository = "https://github.com/cprieto/gotek-core"
documentation = "https://docs.rs/gotek-core"

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
fatfs = "0.3.6"

[features]
cli = ["dep:clap"]

[[bin]]
name = "gotek"
path = "src/main.rs"
required-features = ["cli"]
