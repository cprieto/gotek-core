[package]
name = "gotek-core"
version = "0.1.0"
edition = "2024"
description = "Inspection and empty-image generation for ipcas Gotek floppy images"

# Publish only implementation, factual format fixtures, and project documentation.
# Local captures and research reports can contain third-party executable code.
license = "MIT OR Apache-2.0"
include = [
    "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "GOTEK_FORMAT_SPEC.md",
    "src/**/*.rs", "src/boot/*.S", "src/boot/README.md",
    "tests/**/*.rs", "tests/fixtures/*-bpb.bin", "tests/fixtures/*-root-label.bin",
    "tests/fixtures/README.md", "examples/**/*.rs",
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }

[features]
cli = ["dep:clap"]

[[bin]]
name = "gotek"
path = "src/main.rs"
required-features = ["cli"]
